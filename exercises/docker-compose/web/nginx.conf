server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        # Docker's DNS resolves the Compose service name, even after API recreation.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend api:5000;
        # /api/message in the browser becomes /message on the Python server.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
