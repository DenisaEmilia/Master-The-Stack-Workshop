<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master the Stack — DevOps Escape Room</title>
  <style>
    :root { --primary: #2563eb; --ink: #17243b; --paper: #f2f5fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; line-height: 1.6; }
    main { max-width: 900px; margin: auto; }
    header { margin-bottom: 24px; font-size: .75rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    section { padding: clamp(28px, 6vw, 60px); background: var(--primary); color: white; border-radius: 24px; }
    h1 { margin: 20px 0; font-size: clamp(2.2rem, 7vw, 4rem); letter-spacing: -.05em; line-height: 1.1; }
    .badge { display: inline-block; padding: 5px 14px; border: 1px solid #ffffff80; border-radius: 999px; }
    #release-message { font-size: 1.5rem; }
    aside { margin-top: 24px; padding: 28px; background: white; border-radius: 20px; }
    p { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header>Master the Stack / Workshop</header>
    <section>
      <span class="badge">DevOps Escape Room</span>
      <h1>Eight gates.<br>One green pipeline.</h1>
      <p id="release-message">Hello from Version 1!</p>
      <p>The server can be alive while the release is wrong. Trust what you test.</p>
    </section>
    <aside>The rubber duck is listening. Captain Dockerbeard is watching. Read the next failing gate to continue your mission.</aside>
  </main>
</body>
</html>
